name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Node 20 bundles npm 10, which is stricter than npm 11 about validating
      # optional/platform-specific transitive deps (e.g. rolldown's wasm32-wasi
      # binding) and fails "npm ci" on a lockfile that npm 11 installs cleanly.
      - name: Update npm
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test
